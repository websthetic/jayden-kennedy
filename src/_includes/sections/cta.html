<!--                     CTA                      -->
<!--   Full-bleed photo with a vertical parallax   -->
<!--   scrub. cta.js sets --p; the CSS does the    -->
<!--   rest, so with JS off the image simply sits  -->
<!--   centred.                                    -->
<!-- ============================================ -->

<section id="cta">
    <!-- The frame clips; the media inside is taller than it and travels. -->
    <div class="cs-frame">
        <img
            class="cs-media"
            src="https://websthetic.tor1.cdn.digitaloceanspaces.com/jayden-kennedy/landing-page/jk-hero-image-placeholder.jpg"
            alt=""
            width="2000"
            height="1333"
            loading="lazy"
            decoding="async"
            aria-hidden="true">
    </div>

    <div class="cs-content">
        <h2 class="cs-title">Let&rsquo;s talk about what&rsquo;s next</h2>
        <p class="cs-text">
            Whether you&rsquo;re buying your first place, selling a home you&rsquo;ve
            outgrown, or building something longer-term, the conversation starts
            the same way &mdash; with your numbers and what you actually want.
        </p>
        <a href="/contact/" class="cs-button-light">Let&rsquo;s Connect</a>
    </div>
</section>
