# Replace the "backend" object below with the snippet from DecapBridge. We need something here to get the CMS to work locally, but this alone won't work in production
backend:
    name: git-gateway

# Keep this to allow you to edit the cms locally
local_backend: true

# Jayden Kennedy Real Estate branding. Same mark used in the live site's
# header (src/_includes/sections/header.html, .cs-mark-dark).
logo_url: https://websthetic.tor1.cdn.digitaloceanspaces.com/jayden-kennedy/jayden-kennedy-icon-logo.png
site_url: https://www.soldbykennedy.ca
display_url: https://www.soldbykennedy.ca

# Image folders
media_folder: "src/assets/images/journal"
public_folder: "/assets/images/journal"

# Decap CMS Collections
collections:
    # Points at src/_data/listingFilters.json — a pure data file, not a
    # page. Both the /listings/ filter form and the two homepage search
    # widgets render their Region/City <option> lists from this same
    # file (Nunjucks {% for %} loops), and the listings-search Netlify
    # Function reads it too (netlify/functions/lib/listingsFilter.js), so
    # editing it here changes the search everywhere at once — no code
    # change needed to add or remove a searchable area.
    - name: "listing-filters"
      label: "Listing Search Filters"
      files:
          - name: "listing-filters"
            label: "Regions & Cities"
            file: "src/_data/listingFilters.json"
            fields:
                - label: "Regions"
                  name: "regions"
                  widget: "list"
                  hint: "Shown in the Region dropdown. Adding a region with no active listing in it doesn't break anything — that search just comes back empty until a listing exists there."
                  fields:
                      - { label: "Internal Value (lowercase, no spaces — e.g. \"durham\")", name: "value", widget: "string" }
                      - { label: "Dropdown Label (e.g. \"Durham Region\")", name: "label", widget: "string" }
                      - { label: "Exact MLS County/Region Name (must match PropTx's CountyOrParish field exactly, case-sensitive — e.g. \"Durham\")", name: "resoValue", widget: "string" }
                - label: "Cities"
                  name: "cities"
                  widget: "list"
                  hint: "Shown in the City dropdown, narrowed to whichever Region is selected. The Region field below must exactly match one of the Regions' \"Internal Value\" above."
                  fields:
                      - { label: "Internal Value (lowercase, no spaces — e.g. \"clarington\")", name: "value", widget: "string" }
                      - { label: "Dropdown Label (e.g. \"Clarington\")", name: "label", widget: "string" }
                      - { label: "Exact MLS City Name (must match PropTx's City field exactly, case-sensitive — e.g. \"Clarington\")", name: "resoValue", widget: "string" }
                      - { label: "Region (must match a Region's Internal Value above — e.g. \"durham\")", name: "region", widget: "string" }
                - label: "Result Municipalities"
                  name: "resultsCities"
                  widget: "list"
                  hint: "Shown in the /results/ page's Municipality dropdown. A separate list from Cities above — a closed deal can be anywhere Jayden has ever transacted, not just the areas with current active inventory, so this isn't tied to a Region."
                  fields:
                      - { label: "Internal Value (lowercase, no spaces — e.g. \"ajax\")", name: "value", widget: "string" }
                      - { label: "Dropdown Label (e.g. \"Ajax\")", name: "label", widget: "string" }
                      - { label: "Exact MLS City Name (must match PropTx's City field exactly, case-sensitive — e.g. \"Ajax\")", name: "resoValue", widget: "string" }

    # Points at src/content/journal, the folder Eleventy actually reads for
    # the /journal/ index and each post's page (see journal.json, which
    # tags every file here "post" and computes its permalink). Journal
    # design and templates are untouched — this collection only edits the
    # front matter and body those templates already read.
    - name: "journal"
      label: "Journal"
      folder: "src/content/journal"
      create: true
      slug: "{{slug}}"
      fields:
          - label: "SEO Title"
            name: "seoTitle"
            widget: "string"
            required: false
            hint: "Shown in the browser tab and in Google/social previews. Starts out matching Title below — edit it if you want the search-engine snippet to read differently from the on-page headline."
          - label: "SEO Description"
            name: "seoDescription"
            widget: "text"
            required: false
            hint: "Shown in Google/social previews. Starts out matching Description below — edit it if you want the search-engine snippet to read differently from the on-page dek."
          - { label: "Title", name: "title", widget: "string", hint: "The on-page headline, shown as the H1 on the post and as the title on the journal index list." }
          - {
                label: "URL Slug",
                name: "url",
                widget: "string",
                hint: 'Sets the page path. "How Property Creates Wealth" would need a url like "how-property-creates-wealth", making the post accessible from "/journal/how-property-creates-wealth/"',
            }
          - { label: "Description", name: "description", widget: "text", hint: "The on-page dek, shown under the title on the post itself and as the excerpt on the journal index list." }
          - { label: "Author", name: "author", widget: "string", default: "Jayden Kennedy" }
          - { label: "Date", name: "date", widget: "datetime" }
          - { label: "Read Time (minutes)", name: "readTime", widget: "number", value_type: "int", required: false }
          - { label: "Featured Image", name: "image", widget: "image" }
          - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

    # Static page collection. Each page is registered individually below
    # because every page has its own bespoke section layout — fields map
    # 1:1 to the front-matter blocks each template reads from.
    - name: "pages"
      label: "Pages"
      files:
          - name: "about"
            label: "About"
            file: "src/content/pages/about.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Intro"
                  name: "intro"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Portrait", name: "image", widget: "image", media_folder: "src/assets/images/pages", public_folder: "/assets/images/pages" }
                      - { label: "Portrait Alt Text", name: "imageAlt", widget: "string" }
                      - { label: "Rail Text", name: "railText", widget: "text" }
                - label: "Speaking CTA"
                  name: "cta"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Body", name: "body", widget: "text" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }

          - name: "contact"
            label: "Contact"
            file: "src/content/pages/contact.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Intro"
                  name: "intro"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Text", name: "text", widget: "text" }
                - label: "Form"
                  name: "form"
                  widget: "object"
                  fields:
                      - { label: "Success Message", name: "successMessage", widget: "string", hint: "Shown after a visitor submits the enquiry form." }

          - name: "buying"
            label: "Buying"
            file: "src/content/pages/buying.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                - label: "Before You Look"
                  name: "financing"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Body", name: "body", widget: "text" }
                - label: "What You Get on Every Property"
                  name: "everyProperty"
                  widget: "object"
                  fields:
                      - { label: "Image", name: "image", widget: "image", media_folder: "src/assets/images/pages", public_folder: "/assets/images/pages" }
                      - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
                      - { label: "Heading", name: "heading", widget: "string" }
                      - label: "List Items"
                        name: "items"
                        widget: "list"
                        fields:
                            - { label: "Number", name: "num", widget: "string", hint: 'e.g. "01"' }
                            - { label: "Text", name: "text", widget: "string" }
                      - { label: "Footnote", name: "footnote", widget: "string" }
                - label: "The Offer"
                  name: "offer"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - label: "Notes"
                        name: "notes"
                        widget: "list"
                        fields:
                            - { label: "Title", name: "title", widget: "string" }
                            - { label: "Text", name: "text", widget: "text" }
                      - { label: "Footnote", name: "footnote", widget: "string" }
                - label: "Closing CTA"
                  name: "cta"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Primary Button Label", name: "primaryButtonLabel", widget: "string" }
                      - { label: "Secondary Button Label", name: "secondaryButtonLabel", widget: "string" }
                      - { label: "Fine Print", name: "fine", widget: "string" }

          - name: "investing"
            label: "Investing"
            file: "src/content/pages/investing.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                - label: "The Four Returns"
                  name: "returns"
                  widget: "list"
                  fields:
                      - { label: "Number", name: "num", widget: "string", hint: 'e.g. "01"' }
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Text", name: "text", widget: "text" }
                - label: "What I Run on Every Deal"
                  name: "everyDeal"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Subtext", name: "subtext", widget: "string" }
                      - label: "Checks"
                        name: "checks"
                        widget: "list"
                        fields:
                            - { label: "Number", name: "num", widget: "string", hint: 'e.g. "01"' }
                            - { label: "Text", name: "text", widget: "string" }
                - label: "What I Won't Do"
                  name: "wontDo"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Subtext", name: "subtext", widget: "string" }
                      - { label: "Text", name: "text", widget: "text" }
                - label: "Closing CTA"
                  name: "cta"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }
                      - { label: "Fine Print", name: "fine", widget: "string" }

          - name: "selling"
            label: "Selling"
            file: "src/content/pages/selling.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                - label: "How a Sale Runs"
                  name: "saleRuns"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "string" }
                      - label: "Stages"
                        name: "stages"
                        widget: "list"
                        fields:
                            - { label: "Number", name: "num", widget: "string", hint: 'e.g. "01"' }
                            - { label: "Title", name: "title", widget: "string" }
                            - { label: "Text", name: "text", widget: "text" }
                - label: "The Analysis"
                  name: "costs"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Subtext", name: "subtext", widget: "string" }
                      - { label: "Text", name: "text", widget: "text" }
                      - { label: "Statement", name: "statement", widget: "text" }
                - label: "What I Need From You"
                  name: "whatINeed"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Subtext", name: "subtext", widget: "string" }
                      - label: "Asks"
                        name: "asks"
                        widget: "list"
                        fields:
                            - { label: "Number", name: "num", widget: "string", hint: 'e.g. "01"' }
                            - { label: "Text", name: "text", widget: "string" }
                      - { label: "Closing Line", name: "close", widget: "text" }
                - label: "Closing CTA"
                  name: "cta"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Primary Button Label", name: "primaryButtonLabel", widget: "string" }
                      - { label: "Secondary Button Label", name: "secondaryButtonLabel", widget: "string" }
                      - { label: "Fine Print", name: "fine", widget: "string" }

          - name: "reviews"
            label: "Reviews"
            file: "src/content/pages/reviews.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Intro"
                  name: "intro"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                - label: "Reviews"
                  name: "reviews"
                  widget: "list"
                  hint: "Each review's slug is linked to from the homepage (#slug). Do not change a slug without updating the homepage's matching link, and keep exactly one review marked Featured."
                  fields:
                      - { label: "Slug (do not change without updating the homepage)", name: "slug", widget: "string" }
                      - { label: "Featured (green panel)", name: "featured", widget: "boolean", default: false }
                      - { label: "Quote (first paragraph, always visible)", name: "quote", widget: "text" }
                      - label: "Remaining Paragraphs (behind \"Read more\")"
                        name: "restParagraphs"
                        widget: "list"
                        field: { label: "Paragraph", name: "paragraph", widget: "text" }
                      - { label: "Star Rating", name: "stars", widget: "number", default: 5, min: 1, max: 5, value_type: "int" }
                      - { label: "Reviewer Name", name: "reviewerName", widget: "string" }
                      - { label: "Reviewer's Google Review Link", name: "reviewerLink", widget: "string" }
                      - { label: "Date (YYYY-MM-DD)", name: "date", widget: "string", pattern: ['^\d{4}-\d{2}-\d{2}$', "Use YYYY-MM-DD"] }
                      - { label: "Date Label (e.g. \"June 2026\")", name: "dateLabel", widget: "string" }
                - label: "Closing CTA"
                  name: "cta"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Lede", name: "lede", widget: "text" }
                      - { label: "Button Label", name: "buttonLabel", widget: "string" }
                      - { label: "Button Link", name: "buttonLink", widget: "string" }

          - name: "accessibility"
            label: "Accessibility"
            file: "src/content/pages/accessibility.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Standfirst", name: "standfirst", widget: "text" }
                      - { label: "Last Updated (YYYY-MM-DD)", name: "lastUpdated", widget: "string", pattern: ['^\d{4}-\d{2}-\d{2}$', "Use YYYY-MM-DD"] }
                - label: "The Commitment"
                  name: "commitment"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                - label: "The Standard"
                  name: "standard"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                - label: "What Is Built In"
                  name: "built"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        fields:
                            - { label: "Term", name: "term", widget: "string" }
                            - { label: "Description", name: "description", widget: "text" }
                - label: "Known Gaps"
                  name: "gaps"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Intro", name: "intro", widget: "text" }
                      - label: "Items"
                        name: "items"
                        widget: "list"
                        fields:
                            - { label: "Term", name: "term", widget: "string" }
                            - { label: "Description", name: "description", widget: "text" }
                - label: "Other Formats"
                  name: "formats"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                - label: "Feedback"
                  name: "feedback"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Intro", name: "intro", widget: "text" }
                      - { label: "Acknowledgement", name: "acknowledgement", widget: "text" }
                      - { label: "Escalation", name: "escalation", widget: "text" }
                      - { label: "Note", name: "note", widget: "text" }

          - name: "privacy-policy"
            label: "Privacy Policy"
            file: "src/content/pages/privacy-policy.html"
            fields:
                - { label: "SEO Title", name: "title", widget: "string" }
                - { label: "SEO Description", name: "description", widget: "text" }
                - label: "Hero"
                  name: "hero"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Standfirst", name: "standfirst", widget: "text" }
                      - { label: "Last Updated (YYYY-MM-DD)", name: "lastUpdated", widget: "string", pattern: ['^\d{4}-\d{2}-\d{2}$', "Use YYYY-MM-DD"] }
                - { label: "1 · Who I Am", name: "whoIAm", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "2 · Scope", name: "scope", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - label: "3 · What I Collect"
                  name: "whatICollect"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Intro", name: "intro", widget: "text" }
                      - { label: "Items", name: "items", widget: "list", fields: [{ label: "Term", name: "term", widget: "string" }, { label: "Description", name: "description", widget: "text" }] }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                - { label: "4 · Why I Collect It", name: "why", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "5 · Listing Data", name: "listingData", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "6 · Reviews", name: "reviews", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "7 · Cookies and Analytics", name: "cookies", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "8 · Email, Calls, and Texts", name: "email", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - label: "9 · Who Else Sees It"
                  name: "sharing"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                      - { label: "Items", name: "items", widget: "list", fields: [{ label: "Term", name: "term", widget: "string" }, { label: "Description", name: "description", widget: "text" }] }
                - { label: "10 · Where It Is Stored", name: "storage", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "11 · Security", name: "security", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "12 · How Long I Keep It", name: "retention", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - label: "13 · Your Rights and Choices"
                  name: "yourChoices"
                  widget: "object"
                  fields:
                      - { label: "Heading", name: "heading", widget: "string" }
                      - { label: "Items", name: "items", widget: "list", fields: [{ label: "Term", name: "term", widget: "string" }, { label: "Description", name: "description", widget: "text" }] }
                      - { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }
                - { label: "14 · Young People", name: "minors", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
                - { label: "15 · Other Websites", name: "thirdParties", widget: "object", fields: [{ label: "Heading", name: "heading", widget: "string" }, { label: "Paragraphs", name: "paragraphs", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" } }] }
